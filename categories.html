<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Choose a Category — Regex Challenge Game</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="bg-decoration">
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
</div>

<div id="app">
  <section class="screen active">

    <nav class="site-nav fade-in">
      <a href="index.html" class="site-nav-brand">
        <span class="site-nav-brand-icon"><i data-lucide="braces"></i></span>
        Regex Challenge
      </a>
      <div class="site-nav-links">
        <a href="leaderboard.html" class="btn btn-icon" title="Leaderboard"><i data-lucide="trophy"></i></a>
      </div>
    </nav>

    <header class="page-header">
      <div>
        <h2 class="page-title">Choose a Category</h2>
        <p class="page-subtitle">Complete categories in order to unlock the next one.</p>
      </div>
      <div class="overall-progress">
        <span class="overall-progress-label">Overall Progress</span>
        <div class="progress-bar-track">
          <div id="overall-progress-fill" class="progress-bar-fill"></div>
        </div>
      </div>
    </header>

    <div id="category-grid" class="category-grid"></div>
  </section>
</div>

<div id="toast" class="toast"></div>

<div id="loading-overlay" class="loading-overlay">
  <div class="loading-spinner"></div>
  <p>Loading categories...</p>
</div>

<script src="supabase.js"></script>
<script src="ui.js"></script>
<script src="state.js"></script>
<script src="categories.js"></script>
</body>
</html>
