<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Regex Challenge Game</title>
<meta name="description" content="Master Regular Expressions through interactive challenges." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="bg-decoration">
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
</div>

<div id="app">
  <section class="screen active">
    <div class="hero">
      <div class="hero-badge fade-in">
        <i data-lucide="sparkles"></i>
        <span>Interactive Learning Game</span>
      </div>

      <h1 class="hero-title fade-in-up">
        Regex <span class="text-gradient">Challenge</span> Game
      </h1>

      <p class="hero-subtitle fade-in-up delay-1">
        Master Regular Expressions Through Interactive Challenges
      </p>

      <div class="hero-illustration fade-in-up delay-2">
        <div class="regex-card floating">
          <span class="regex-token">^</span><span class="regex-token">[</span><span class="regex-token accent">a-z</span><span class="regex-token">]</span><span class="regex-token">+</span><span class="regex-token">$</span>
        </div>
        <div class="regex-card floating delay-a">
          <span class="regex-token">\d</span><span class="regex-token">{</span><span class="regex-token accent">3</span><span class="regex-token">}</span>
        </div>
        <div class="regex-card floating delay-b">
          <i data-lucide="mail" class="icon-md"></i>
          <span class="regex-token">@</span><span class="regex-token accent">.com</span>
        </div>
      </div>

      <div class="username-field fade-in-up delay-2">
        <label for="username-input" class="username-label">
          <i data-lucide="user"></i>
          Enter your username to play
        </label>
        <input
          type="text"
          id="username-input"
          class="answer-input"
          placeholder="Your username"
          maxlength="20"
          autocomplete="off"
        />
        <p id="username-error" class="feedback-message"></p>
      </div>

      <button id="btn-start-game" class="btn btn-primary btn-lg ripple fade-in-up delay-3">
        <i data-lucide="play"></i>
        Start Game
      </button>

      <a href="leaderboard.html" class="btn btn-ghost fade-in-up delay-3">
        <i data-lucide="trophy"></i>
        View Leaderboard
      </a>
    </div>
  </section>
</div>

<div id="toast" class="toast"></div>

<script src="supabase.js"></script>
<script src="ui.js"></script>
<script src="state.js"></script>
<script src="welcome.js"></script>
</body>
</html>
