<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leaderboard — Regex Challenge Game</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="bg-decoration">
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>
</div>

<div id="app">
  <section class="screen active">

    <nav class="site-nav fade-in">
      <a href="index.html" class="site-nav-brand">
        <span class="site-nav-brand-icon"><i data-lucide="braces"></i></span>
        Regex Challenge
      </a>
      <div class="site-nav-links">
        <a href="categories.html" id="btn-continue-playing" class="btn btn-icon" title="Continue Playing"><i data-lucide="gamepad-2"></i></a>
        <a href="index.html" class="btn btn-icon" title="Home"><i data-lucide="home"></i></a>
      </div>
    </nav>

    <div class="leaderboard-page-wrap scale-in">
      <div class="leaderboard-page-header">
        <div class="modal-icon" style="margin: 0 auto 14px;"><i data-lucide="trophy"></i></div>
        <h2 class="page-title" style="text-align:center;">Top 10 Leaderboard</h2>
        <p class="page-subtitle" style="text-align:center;">The fastest, most accurate regex masters.</p>
      </div>

      <div class="leaderboard-page-card">
        <div id="leaderboard-list" class="leaderboard-list">
          <div class="leaderboard-loading">Loading leaderboard...</div>
        </div>

        <div class="results-actions" style="margin-top: 10px;">
          <a href="categories.html" id="btn-continue-playing-main" class="btn btn-primary btn-lg ripple">
            <i data-lucide="gamepad-2"></i>
            Continue Playing
          </a>
          <a href="index.html" class="btn btn-secondary btn-lg ripple">
            <i data-lucide="home"></i>
            Home
          </a>
        </div>
      </div>
    </div>

  </section>
</div>

<div id="toast" class="toast"></div>

<script src="supabase.js"></script>
<script src="ui.js"></script>
<script src="leaderboard.js"></script>
</body>
</html>
